<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Grile CP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08090a;
  --surface: #111316;
  --surface2: #181b1f;
  --border: #2a2d33;
  --accent: #c8f53f; /* Verde Neon */
  --accent-bg: #1a2100;
  --blue: #38bdf8;
  --red: #f87171;
  --red-bg: #2a0a0a;
  --amber: #fbbf24;
  --text: #f0f2f5;
  --muted: #5a6070;
  --muted2: #363b45;
  --font: 'Syne', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  min-height: 100%; font-family: var(--font);
  background: var(--bg); color: var(--text); overflow-x: hidden;
}

body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.08) 2px, rgba(0,0,0,.08) 4px);
}

/* ── HEADER HUD ── */
header {
  position: sticky; top: 0; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); background: rgba(8, 9, 10, 0.85); backdrop-filter: blur(12px); z-index: 100;
}
.back-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px;
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  text-decoration: none; font-family: var(--mono); font-weight: 800; transition: 0.2s;
}
.back-btn:active { transform: scale(0.9); border-color: var(--amber); color: var(--amber); }

.header-title { font-family: var(--mono); font-size: 11px; font-weight: 800; letter-spacing: .2em; color: var(--amber); }

.hud-xp { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.hud-val { font-family: var(--mono); font-size: 16px; font-weight: 600; line-height: 1; color: var(--accent); }
.hud-label { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ── QUIZ CONTAINER ── */
main { padding: 25px 20px 100px; display: flex; flex-direction: column; gap: 20px; position: relative; }

.quiz-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  padding: 24px; display: flex; flex-direction: column; gap: 24px; position: relative;
}
.option-btn.selected {
  border-color: var(--blue);
  background: var(--blue-bg);
  transform: scale(0.98);
}
.option-btn.disabled {
  pointer-events: none;
}
.option-btn.missed {
  border: 2px dashed var(--accent);
  opacity: 0.8;
}

.quiz-header { display: flex; justify-content: space-between; align-items: center; }
.question-counter { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 2px; }
.combo-badge {
  font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--bg); background: var(--amber);
  padding: 4px 10px; border-radius: 12px; opacity: 0; transform: scale(0.8); transition: 0.3s;
}
.combo-badge.show { opacity: 1; transform: scale(1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }

.question-text { font-size: 1.3rem; font-weight: 700; line-height: 1.4; color: var(--text); }

/* ── OPTIONS GRID ── */
.options-container { display: flex; flex-direction: column; gap: 12px; }

.option-btn {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s;
  text-align: left; position: relative; overflow: hidden;
}
.option-btn:active { transform: scale(0.98); }
.option-btn.disabled { pointer-events: none; }

.option-letter {
  font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--muted);
  background: var(--bg); border: 1px solid var(--border); width: 28px; height: 28px;
  display: grid; place-items: center; border-radius: 8px; flex-shrink: 0; transition: 0.3s;
}
.option-text { font-family: var(--font); font-size: 1rem; color: #d0d4de; line-height: 1.3; font-weight: 600; }

/* Stări de răspuns */
.option-btn.correct { background: var(--accent-bg); border-color: var(--accent); box-shadow: 0 0 15px rgba(200,245,63,0.1); }
.option-btn.correct .option-letter { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.option-btn.correct .option-text { color: var(--accent); }

.option-btn.wrong { background: var(--red-bg); border-color: var(--red); opacity: 0.8; }
.option-btn.wrong .option-letter { background: var(--red); color: var(--bg); border-color: var(--red); }
.option-btn.wrong .option-text { color: var(--red); }

/* ── EXPLANATION & NEXT BTN ── */
.explanation-box {
  background: rgba(56, 189, 248, 0.05); border-left: 3px solid var(--blue);
  padding: 15px; border-radius: 0 12px 12px 0; font-size: 0.9rem; color: #a5b4fc;
  line-height: 1.5; display: none; margin-top: 5px; animation: fadeIn 0.4s ease forwards;
}

.next-btn {
  background: var(--text); color: var(--bg); border: none; border-radius: 14px;
  padding: 16px; font-family: var(--font); font-size: 1rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 1px; cursor: pointer; display: none;
  transition: 0.2s; margin-top: 10px;
}
.next-btn:active { transform: scale(0.95); }

/* ── FLASH OVERLAYS ── */
.flash-overlay { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 50; }
.flash-overlay.green { background: rgba(200,245,63,0.1); animation: flashfade 0.5s forwards; }
.flash-overlay.red { background: rgba(248,113,113,0.15); animation: flashfade 0.5s forwards; }

@keyframes flashfade { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ── RESULT SCREEN ── */
.result-screen {
  text-align: center; display: none; flex-direction: column; align-items: center; gap: 20px;
  padding: 40px 20px; animation: fadeIn 0.5s forwards;
}
.result-title { font-size: 2rem; font-weight: 800; color: var(--text); }
.result-score { font-family: var(--mono); font-size: 4rem; color: var(--accent); font-weight: 800; text-shadow: 0 0 30px rgba(200,245,63,0.3); }
.result-xp { font-family: var(--mono); font-size: 1.2rem; color: var(--blue); letter-spacing: 1px; }

/* PARTICLES */
.particle { position: fixed; pointer-events: none; z-index: 200; border-radius: 50%; animation: particleFly 0.8s ease forwards; }
@keyframes particleFly { to { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); } }
</style>
</head>

  <header>
    <a href="index.html" class="back-btn">←</a>

  {
    q: "50. Contul reprezintă:",
    options: [
      "a) un numar",
      "b) un procedeu specific cunoașterii contabile prin care se stabilește existentul inițial, modificările ulterioare și situația finală a unei substanțe patrimoniale determinate",
      "c) un simbol",
      "d) o resursă financiară pe termen scurt sau lung depusă la bancă ce are ca beneficiu dobândă"
    ],
    correct: [1],
    expl: "Mna, aia-i definiția contului"
  }
];
// --- UTILITIES: ALGORITMUL DE SHUFFLE (Fisher-Yates) ---
    function shuffleArray(array) {
      let currentIndex = array.length, randomIndex;
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        // Schimbă elementele între ele
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }

    // --- STATE-UL APLICAȚIEI ---
    let currentQ = 0;
    let score = 0;
    let combo = 0;
    let sessionXP = 0;
    let sessionQuestions = [];     // Aici vom ține cele 10 grile extrase random
    let currentCorrectIndex = -1;  // Memorează unde se află varianta corectă DUPĂ amestecare
    
    // Inițializare XP Global din memorie
    let db = JSON.parse(localStorage.getItem('ec_ultra2') || '{}');
    if (!db._meta) db._meta = { xp: 0 };
    let state = db._meta;
    document.getElementById('global-xp').textContent = state.xp;

    const letters = ['A', 'B', 'C', 'D', 'E', 'F']; // Suportă și grile cu mai multe variante

function startQuiz() {
      sessionQuestions = shuffleArray([...questions]);
      loadQuestion();
    }

let selectedIndices = []; // Aici ținem minte ce apasă userul
    let correctIndices = [];  // Aici știm unde s-au ascuns variantele corecte după Shuffle

function loadQuestion() {
      const q = sessionQuestions[currentQ];
      selectedIndices = [];
      correctIndices = [];
      
      let qNum = (currentQ + 1).toString().padStart(2, '0');
      let tNum = sessionQuestions.length.toString().padStart(2, '0');
      document.getElementById('q-counter').textContent = `Q ${qNum}/${tNum}`;
      
      // 🧹 TRUCUL MAGIC PENTRU ÎNTREBĂRI: Tăiem "1. ", "45. " și punem ordinea corectă
      let cleanQuestionText = q.q.replace(/^\d+[\.\)]\s*/, '');
      document.getElementById('q-text').textContent = (currentQ + 1) + '. ' + cleanQuestionText;
      
      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';
      
      // MAGIA 1: Suportă și număr simplu (correct: 1) și listă (correct: [0, 2])
      let optionsWithStatus = q.options.map((text, index) => {
        let isCorr = Array.isArray(q.correct) ? q.correct.includes(index) : q.correct === index;
        return { text: text, isCorrect: isCorr };
      });

      optionsWithStatus = shuffleArray(optionsWithStatus);
      
      optionsWithStatus.forEach((opt, index) => {
        // Notăm unde a picat varianta corectă
        if (opt.isCorrect) correctIndices.push(index);

        let cleanText = opt.text.replace(/^[a-z]\)\s*/i, '').trim();
        let newLetter = String.fromCharCode(97 + index); 
        let finalText = newLetter + ') ' + cleanText;

        const btn = document.createElement('div');
        btn.className = 'option-btn';
        btn.innerHTML = `<div class="option-letter">${letters[index]}</div><div class="option-text">${finalText}</div>`;
        
        // În loc să verificăm instant, doar selectăm/deselectăm butonul
        btn.onclick = () => toggleOption(index, btn);
        optionsBox.appendChild(btn);
      });

      document.getElementById('explanation-box').style.display = 'none';
      
      // Setăm butonul de Next să fie "Verifică"
      let nextBtn = document.getElementById('next-btn');
      nextBtn.textContent = 'Verifică Răspunsul ✓';
      nextBtn.style.display = 'none'; // E ascuns până selectezi măcar o variantă
      nextBtn.onclick = verifyAnswer; // Schimbăm funcția butonului
    }

      document.getElementById('explanation-box').style.display = 'none';
      
      // Setăm butonul de Next să fie "Verifică"
      let nextBtn = document.getElementById('next-btn');
      nextBtn.textContent = 'Verifică Răspunsul ✓';
      nextBtn.style.display = 'none'; // E ascuns până selectezi măcar o variantă
      nextBtn.onclick = verifyAnswer;

    // Funcția care doar "bifează" sau "debifează" o variantă
    function toggleOption(index, btn) {
      if (btn.classList.contains('disabled')) return;

      let pos = selectedIndices.indexOf(index);
      if (pos === -1) {
        selectedIndices.push(index);
        btn.classList.add('selected');
      } else {
        selectedIndices.splice(pos, 1);
        btn.classList.remove('selected');
      }

      // Arată butonul "Verifică" doar dacă ai ales ceva
      document.getElementById('next-btn').style.display = selectedIndices.length > 0 ? 'block' : 'none';
    }

// NOUA Funcție care controlează validarea finală a grilei
    function verifyAnswer() {
      const q = sessionQuestions[currentQ];
      const allBtns = document.querySelectorAll('.option-btn');
      
      // Blocăm butoanele să nu mai poți modifica
      allBtns.forEach(b => b.classList.add('disabled'));
      
      // Sortăm listele ca să le putem compara ușor
      selectedIndices.sort();
      correctIndices.sort();

      // Verificăm dacă ai nimerit TOT și EXACT ce trebuia
      let isPerfectMatch = (selectedIndices.length === correctIndices.length) &&
                           selectedIndices.every((val, i) => val === correctIndices[i]);

      const flash = document.getElementById('flash-overlay');
      flash.className = 'flash-overlay';
      void flash.offsetWidth;

      if (isPerfectMatch) {
        // EȘTI GENIU! Răspuns 100% corect
        selectedIndices.forEach(idx => allBtns[idx].classList.add('correct'));
        flash.classList.add('green');
        combo++;
        score++;
        
        let xpGained = 15; // Câștigi mai mult că e mai greu cu variante multiple
        if (combo >= 2) {
          xpGained += 5 * combo; 
          showComboBadge();
        }
        
        addXP(xpGained);
        spawnParticles(document.body, 'var(--accent)');
        if (navigator.vibrate) navigator.vibrate([20, 30, 50]);
        
      } else {
        // AI GREȘIT (sau ai ratat o variantă corectă)
        selectedIndices.forEach(idx => {
           if (correctIndices.includes(idx)) {
               allBtns[idx].classList.add('correct'); // Ai intuit-o bine pe asta
           } else {
               allBtns[idx].classList.add('wrong'); // Asta era capcană
           }
        });
        
        // Îți arătăm ce ai uitat să bifezi (apare cu border întrerupt/dashed)
        correctIndices.forEach(idx => {
           if (!selectedIndices.includes(idx)) {
               allBtns[idx].classList.add('missed'); 
           }
        });

        flash.classList.add('red');
        combo = 0;
        hideComboBadge();
        if (navigator.vibrate) navigator.vibrate([80]);
      }

      // 💡 MODIFICAREA AICI: Afișăm explicația mereu, indiferent dacă e corect sau greșit!
      const explBox = document.getElementById('explanation-box');
      explBox.textContent = `💡 Info: ${q.expl}`;
      explBox.style.display = 'block';

      // Acum transformăm butonul din "Verifică" în "Următoarea"
      let nextBtn = document.getElementById('next-btn');
      nextBtn.textContent = 'Următoarea →';
      nextBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < sessionQuestions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-card').style.display = 'none';
      const resScreen = document.getElementById('result-screen');
      resScreen.style.display = 'flex';
      
      document.getElementById('final-score').textContent = `${score}/${sessionQuestions.length}`;
      document.getElementById('final-xp').textContent = `Date extrase: +${sessionXP} XP`;
      
      spawnParticles(document.body, 'var(--blue)');
      spawnParticles(document.body, 'var(--accent)');
    }

    // --- SISTEMUL XP & EFECTE ---
    function addXP(amount) {
      sessionXP += amount;
      state.xp += amount;
      db._meta = state;
      localStorage.setItem('ec_ultra2', JSON.stringify(db));
      document.getElementById('global-xp').textContent = state.xp;
    }

    function showComboBadge() {
      const badge = document.getElementById('combo-badge');
      badge.textContent = `${combo}x COMBO`;
      badge.classList.add('show');
    }
    
    function hideComboBadge() {
      document.getElementById('combo-badge').classList.remove('show');
    }

    function spawnParticles(el, color) {
      let rect = el.getBoundingClientRect();
      let cx = rect.left + rect.width/2; let cy = rect.top + rect.height/2;
      for(let i=0; i<15; i++) {
        let p = document.createElement('div');
        p.className = 'particle';
        let angle = (i/15) * Math.PI * 2; let dist = 50 + Math.random()*80;
        p.style.cssText = `width:5px; height:5px; background:${color}; left:${cx}px; top:${cy}px; --tx:${Math.cos(angle)*dist}px; --ty:${Math.sin(angle)*dist}px;`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    startQuiz();
  </script>
</body>
