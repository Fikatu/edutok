<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Contabilitate Publică</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08090a;
  --surface: #111316;
  --surface2: #181b1f;
  --border: #2a2d33;
  --accent: #c8f53f;
  --accent-dim: #8aaa1f;
  --accent-bg: #1a2100;
  --blue: #38bdf8;
  --blue-bg: #001e30;
  --red: #f87171;
  --red-bg: #2a0a0a;
  --amber: #fbbf24;
  --amber-bg: #271a00;
  --text: #f0f2f5;
  --muted: #5a6070;
  --muted2: #363b45;
  --font: 'Syne', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height:100%; overflow:hidden;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
}

/* ── SCANLINE OVERLAY ── */
body::before {
  content:'';
  position:fixed; inset:0; pointer-events:none; z-index:999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.08) 2px, rgba(0,0,0,.08) 4px);
}

/* ── LAYOUT ── */
#app {
  height:100dvh;
  display:grid;
  grid-template-rows: auto 1fr auto;
  gap:0;
}

/* ── HEADER ── */
header {
  padding: 14px 20px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom: 1px solid var(--border);
  position:relative;
  z-index:10;
}

.logo {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
}

.hud {
  display:flex;
  gap: 18px;
  align-items:center;
}

.hud-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
}

.hud-val {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 600;
  line-height:1;
}

.hud-label {
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}

#hud-xp .hud-val { color: var(--accent); }
#hud-streak .hud-val { color: var(--amber); }
#hud-level .hud-val { color: var(--blue); }

/* ── XP BAR ── */
.xp-track {
  height: 2px;
  background: var(--muted2);
  position:relative;
}

.xp-fill {
  height:100%;
  background: var(--accent);
  transition: width .6s cubic-bezier(.16,1,.3,1);
  position:relative;
  overflow:hidden;
}

.xp-fill::after {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.4) 50%, transparent 100%);
  animation: shimmer 1.8s infinite;
}

@keyframes shimmer {
  from { transform: translateX(-100%); }
  to   { transform: translateX(100%); }
}

/* ── FEED AREA ── */
.feed-wrap {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding: 20px 20px 10px;
  position:relative;
  overflow:hidden;
}

/* ── CARD FLIP ── */
.card-scene {
  width:100%;
  max-width: 420px;
  perspective: 1000px;
  position:relative;
  touch-action: pan-y; /* MAGIA: Oprește browserul să dea "Back" când dai swipe! */
}

.card-flipper {
  width:100%;
  min-height: 420px;
  position:relative;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.16,1,.3,1);
}

.card-flipper.flipped {
  transform: rotateY(180deg);
}

.card-face {
  position:absolute; inset:0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 20px;
  padding: 28px 24px;
  border: 1px solid var(--border);
  background: var(--surface);
  display:flex;
  flex-direction:column;
  min-height: 420px;
}

.card-back {
  transform: rotateY(180deg);
}

/* front */
.card-category {
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  font-family: var(--mono);
  margin-bottom: 20px;
  display:flex;
  align-items:center;
  gap:8px;
}

.card-category::before {
  content:'';
  display:block;
  width:6px; height:6px;
  border-radius:50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.card-number {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 12px;
}

.card-question {
  font-size: 1.45rem;
  font-weight: 700;
  line-height: 1.3;
  flex:1;
  display:flex;
  align-items:center;
  letter-spacing: -.01em;
}

.tap-hint {
  display:flex;
  align-items:center;
  gap:8px;
  margin-top: 24px;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .1em;
  text-transform: uppercase;
}

.tap-hint-icon {
  width:28px; height:28px;
  border-radius:8px;
  border: 1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size: 14px;
  animation: pulse-border 2s ease infinite;
}

@keyframes pulse-border {
  0%, 100% { border-color: var(--border); }
  50% { border-color: var(--accent); }
}

/* back */
.answer-label {
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--accent);
  font-family: var(--mono);
  margin-bottom: 16px;
}

.answer-text {
  font-size: 1.05rem;
  line-height: 1.65;
  flex: 1;
  color: #d0d4de;
  overflow-y: auto; /* Permite scroll în interior */
  padding-right: 8px; /* Spațiu pt scrollbar */
  overscroll-behavior: contain; /* Previne scroll-ul întregii pagini */
}

.answer-text::-webkit-scrollbar { width: 4px; }
.answer-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.action-row {
  display:grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 24px;
}

.btn-action {
  padding: 12px 6px;
  border-radius: 12px;
  border: 1px solid;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .05em;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  transition: transform .12s ease, filter .12s ease;
  background: transparent;
}

.btn-action:active { transform:scale(.95); filter:brightness(.8); }

.btn-icon { font-size: 18px; line-height:1; }

.btn-dont {
  border-color: #3d1515;
  color: var(--red);
}
.btn-dont:hover { background: var(--red-bg); }

.btn-hard {
  border-color: #3d2e00;
  color: var(--amber);
}
.btn-hard:hover { background: var(--amber-bg); }

.btn-know {
  border-color: #2a3800;
  color: var(--accent);
}
.btn-know:hover { background: var(--accent-bg); }

/* ── COMBO BADGE ── */
.combo-badge {
  position:absolute;
  top: -16px; right: 16px;
  background: var(--amber);
  color: #000;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  transform: scale(0);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  z-index:5;
  pointer-events:none;
}

.combo-badge.show { transform: scale(1); }

/* ── FLASH OVERLAY ── */
.flash-overlay {
  position:absolute; inset:0;
  border-radius: 20px;
  pointer-events:none;
  opacity:0;
  transition: opacity .05s;
}

.flash-overlay.flash-green { background: rgba(200,245,63,.12); border: 1px solid rgba(200,245,63,.4); border-radius: 20px; opacity:1; animation: flashfade .5s forwards; }
.flash-overlay.flash-red   { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.4); border-radius: 20px; opacity:1; animation: flashfade .5s forwards; }

@keyframes flashfade {
  0% { opacity:1; }
  100% { opacity:0; }
}

.swipe-hint {
  display:flex;
  gap:24px;
  margin-top: 10px;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .08em;
  justify-content:center;
  opacity: 0; /* Ascuns inițial */
  transition: opacity 0.3s ease;
  pointer-events: none;
}
.swipe-hint.show { opacity: 0.6; }

.swipe-hint span { display:flex; align-items:center; gap:4px; }

/* ── BOTTOM BAR ── */
footer {
  padding: 12px 20px 18px;
  border-top: 1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.progress-section {
  flex:1;
  margin-right: 20px;
}

.progress-label {
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
  display:flex;
  justify-content:space-between;
}

.progress-track {
  height: 4px;
  background: var(--muted2);
  border-radius: 4px;
  overflow:hidden;
}

.progress-fill {
  height:100%;
  background: var(--accent);
  border-radius: 4px;
  transition: width .5s cubic-bezier(.16,1,.3,1);
}

.next-due {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

/* ── CARD ENTER ANIMATION ── */
.card-scene { animation: cardEnter .4s cubic-bezier(.16,1,.3,1); }

@keyframes cardEnter {
  from { opacity:0; transform: translateY(24px) scale(.96); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}

/* ── CARD EXIT ── */
.card-scene.exit-right { animation: exitRight .3s ease forwards; }
.card-scene.exit-left  { animation: exitLeft  .3s ease forwards; }

@keyframes exitRight {
  to { opacity:0; transform: translateX(80px) rotate(8deg); }
}
@keyframes exitLeft {
  to { opacity:0; transform: translateX(-80px) rotate(-8deg); }
}

/* ── XP POPUP ── */
.xp-popup {
  position:fixed;
  bottom:100px;
  right:24px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  opacity:0;
  pointer-events:none;
  z-index:50;
}

.xp-popup.pop { animation: xpPop .9s ease forwards; }

@keyframes xpPop {
  0%   { opacity:0; transform: translateY(0); }
  20%  { opacity:1; }
  100% { opacity:0; transform: translateY(-50px); }
}

/* ── LEVEL UP SCREEN ── */
.levelup-screen {
  position:fixed; inset:0;
  background: rgba(0,0,0,.92);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index: 100;
  opacity:0;
  pointer-events:none;
  transition: opacity .3s;
}

.levelup-screen.show {
  opacity:1;
  pointer-events:all;
}

.levelup-num {
  font-size: 7rem;
  font-weight: 800;
  color: var(--accent);
  line-height:1;
  letter-spacing: -.04em;
  animation: levelPulse 1s ease infinite alternate;
}

@keyframes levelPulse {
  from { text-shadow: 0 0 40px rgba(200,245,63,.4); }
  to   { text-shadow: 0 0 80px rgba(200,245,63,.8); }
}

.levelup-label {
  font-size: 1rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 8px;
}

.levelup-close {
  margin-top:40px;
  padding: 12px 32px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 12px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 700;
  cursor:pointer;
  letter-spacing: .08em;
}

/* ── PARTICLES ── */
.particle {
  position:fixed;
  pointer-events:none;
  z-index:200;
  border-radius:50%;
  animation: particleFly 1s ease forwards;
}

@keyframes particleFly {
  to { opacity:0; transform: translate(var(--tx), var(--ty)) scale(0); }
}

</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo">EduCards</div>
    <div class="hud">
      <div class="hud-item" id="hud-streak">
        <div class="hud-val" id="streak-val">0</div>
        <div class="hud-label">Streak</div>
      </div>
      <div class="hud-item" id="hud-xp">
        <div class="hud-val" id="xp-val">0</div>
        <div class="hud-label">XP</div>
      </div>
      <div class="hud-item" id="hud-level">
        <div class="hud-val" id="level-val">1</div>
        <div class="hud-label">Nivel</div>
      </div>
    </div>
  </header>
  <div class="xp-track"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>

  <div class="feed-wrap" id="feed-wrap">
    <!-- card injected here -->
  </div>

  <footer>
    <div class="progress-section">
      <div class="progress-label">
        <span>Azi</span>
        <span id="today-label">0 / 10</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="today-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="next-due" id="next-due"></div>
  </footer>
</div>

<div class="xp-popup" id="xp-popup"></div>

<div class="levelup-screen" id="levelup-screen">
  <div style="font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Nivel nou</div>
  <div class="levelup-num" id="levelup-num">2</div>
  <div class="levelup-label">Deblocat</div>
  <button class="levelup-close" onclick="closeLevelUp()">Continuă →</button>
</div>

<script>
const facts = [
  { category:"CP - US 1", q:"Care sunt entitățile obligate să organizeze și să conducă contabilitate proprie?", a:"Societățile comerciale, societățile/companiile naționale, regiile autonome, institutele naționale de cercetare-dezvoltare, societățile cooperatiste, instituțiile publice, asociațiile și celelalte persoane juridice cu și fără scop patrimonial, precum și persoanele fizice care desfășoară activități producătoare de venituri." },
  { category:"CP - US 1", q:"Care este obiectul contabilității?", a:"Ansamblul mișcărilor de valori exprimabile în bani, precum și raporturile economico-juridice în care unitatea patrimonială este parte și care generează deconturi bănești." },
  { category:"CP - US 1", q:"Ce este metoda contabilității?", a:"Abordarea obiectului contabilității pe baza unor principii, mijloace și procedee, care să ofere o imagine fidelă a poziției financiare și performanței unei entități." },
  { category:"CP - US 1", q:"Care sunt procedeele utilizate pentru cunoașterea obiectului contabilității?", a:"Procedee comune disciplinelor economice și procedee specifice metodei contabilității." },
  { category:"CP - US 1", q:"Care sunt procedeele comune disciplinelor economice?", a:"Documentația, evaluarea, calculația și inventarierea." },
  { category:"CP - US 1", q:"Care sunt procedeele specifice metodei contabilității?", a:"Bilanțul, contul, balanțele de verificare etc." },
  { category:"CP - US 1", q:"Cum se stabilește evaluarea la intrarea în patrimoniul instituției?", a:"Bunuri cu titlu oneros → Costul de achiziție. Bunuri produse în instituție → Costul de producție. Bunuri obținute cu titlu gratuit (donații, sponsorizări) → Valoarea justă." },
  { category:"CP - US 1", q:"Ce cuprinde costul de producție?", a:"Cheltuielile directe aferente producției (materiale directe, energie tehnologică, manoperă directă, alte cheltuieli directe) și cota cheltuielilor indirecte alocată rațional. Exclus: pierderi materiale peste limite, cheltuieli de depozitare neesențiale, regie generală de administrație, costuri de desfacere." },
  { category:"CP - US 1", q:"Ce cuprinde costul de achiziție?", a:"Prețul de cumpărare + taxele de import + alte taxe nerecuperabile + cheltuielile de transport, manipulare și alte cheltuieli atribuibile direct. Reducerile comerciale acordate de furnizor NU fac parte din costul de achiziție." },
  { category:"CP - US 1", q:"Ce reprezintă valoarea justă?", a:"Suma pentru care un activ ar putea fi schimbat de bunăvoie între două părți în cunoștință de cauză, în cadrul unei tranzacții cu prețul determinat obiectiv. Pentru bunurile cu piață, valoarea justă = valoarea de piață." },
  { category:"CP - US 1", q:"Cum se face evaluarea cu ocazia inventarierii?", a:"La valoarea actuală a fiecărui element, denumită valoare de inventar, stabilită în funcție de utilitatea bunului, starea acestuia și prețul pieței." },
  { category:"CP - US 1", q:"Cum se face evaluarea la încheierea exercițiului financiar?", a:"Se pune de acord valoarea de intrare cu rezultatele inventarierii. Valoarea de intrare se compară cu valoarea de inventar stabilită la inventariere." },
  { category:"CP - US 1", q:"Evaluare la închidere — elemente de ACTIV:", a:"Plus de valoare → nu se înregistrează (rămân la valoarea de intrare). Minus de valoare: dacă deprecierea e ireversibilă → amortizare suplimentară; dacă e temporară → ajustare pentru depreciere/pierdere de valoare." },
  { category:"CP - US 1", q:"Evaluare la închidere — elemente de PASIV (datorii):", a:"Minus față de valoarea de intrare → nu se înregistrează. Plus față de valoarea de intrare → se înregistrează pe seama elementelor corespunzătoare de datorii." },
  { category:"CP - US 1", q:"Cum trebuie evaluate elementele monetare exprimate în valută?", a:"Trebuie evaluate și raportate utilizând cursul de schimb comunicat de BNR, valabil la data încheierii exercițiului." },
].filter(f => f.q.trim() !== '');

function getId(f) {
  let s = f.q + f.category, h = 0;
  for(let i=0;i<s.length;i++) h=((h<<5)-h)+s.charCodeAt(i)|0;
  return h;
}

let db = JSON.parse(localStorage.getItem('ec_ultra2')||'{}');
let state = db._meta || { xp:0, streak:0, lastDay:null, todayDone:0, dailyGoal:10 };
let combo = 0;
let prevLevel = Math.floor(state.xp/100)+1;

function save() { db._meta = state; localStorage.setItem('ec_ultra2', JSON.stringify(db)); }

function getCard(id) {
  if(!db[id]) db[id]={interval:1,ease:2.5,due:Date.now(),reps:0};
  return db[id];
}

function nextFact() {
  return [...facts].sort((a,b)=>getCard(getId(a)).due - getCard(getId(b)).due)[0];
}

function updateSRS(id, quality) {
  let c = getCard(id);
  let xpGain;

  if(quality < 3) {
    c.interval = 0.01;
    c.reps = 0;
    combo = 0;
    xpGain = 2;
  } else {
    combo++;
    c.reps++;
    if(c.reps===1) c.interval=1;
    else if(c.reps===2) c.interval=3;
    else c.interval*=c.ease;
    xpGain = quality===5 ? 15 : 8;
    if(combo >= 3) xpGain = Math.round(xpGain * (1 + (combo-2)*0.2));
  }

  c.ease = Math.max(1.3, c.ease + (0.1-(5-quality)*0.08));
  c.due = Date.now() + c.interval*86400000;
  state.xp += xpGain;
  state.todayDone++;

  let today = new Date().toDateString();
  if(state.lastDay !== today) {
    let yesterday = new Date(Date.now()-86400000).toDateString();
    state.streak = (state.lastDay===yesterday) ? state.streak+1 : 1;
    state.lastDay = today;
  }

  save();
  return xpGain;
}

function vibrate(pattern) {
  try { navigator.vibrate && navigator.vibrate(pattern); } catch(e){}
}

function spawnParticles(el, color) {
  let rect = el.getBoundingClientRect();
  let cx = rect.left + rect.width/2;
  let cy = rect.top + rect.height/2;
  for(let i=0;i<12;i++) {
    let p = document.createElement('div');
    p.className = 'particle';
    let angle = (i/12)*Math.PI*2;
    let dist = 40 + Math.random()*60;
    p.style.cssText = `
      width:${4+Math.random()*4}px;
      height:${4+Math.random()*4}px;
      background:${color};
      left:${cx}px; top:${cy}px;
      --tx:${Math.cos(angle)*dist}px;
      --ty:${Math.sin(angle)*dist}px;
    `;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1000);
  }
}

function showXpPopup(xpGain, comboCount) {
  let el = document.getElementById('xp-popup');
  el.textContent = comboCount>=3 ? `+${xpGain} XP  ×${comboCount} COMBO` : `+${xpGain} XP`;
  el.className = '';
  void el.offsetWidth;
  el.className = 'xp-popup pop';
}

function checkLevelUp(oldLevel) {
  let newLevel = Math.floor(state.xp/100)+1;
  if(newLevel > oldLevel) {
    document.getElementById('levelup-num').textContent = newLevel;
    document.getElementById('levelup-screen').classList.add('show');
  }
}

function closeLevelUp() {
  document.getElementById('levelup-screen').classList.remove('show');
}

function updateHUD() {
  let level = Math.floor(state.xp/100)+1;
  let xpInLevel = state.xp % 100;
  document.getElementById('xp-val').textContent = state.xp;
  document.getElementById('level-val').textContent = level;
  document.getElementById('streak-val').textContent = state.streak;
  document.getElementById('xp-fill').style.width = xpInLevel + '%';

  let done = state.todayDone, goal = state.dailyGoal;
  document.getElementById('today-label').textContent = `${done} / ${goal}`;
  document.getElementById('today-fill').style.width = Math.min(100, (done/goal)*100) + '%';

  let nxt = nextFact();
  let nxtCard = getCard(getId(nxt));
  let due = nxtCard.due;
  let diff = due - Date.now();
  let dueStr = diff < 60000 ? 'ora curentă'
             : diff < 3600000 ? `${Math.ceil(diff/60000)}m`
             : diff < 86400000 ? `${Math.ceil(diff/3600000)}h`
             : `${Math.ceil(diff/86400000)}z`;
  document.getElementById('next-due').textContent = `Următor: ${dueStr}`;
}

let currentFact = null;
let isFlipped = false;

function renderCard() {
  currentFact = nextFact();
  isFlipped = false;

  let wrap = document.getElementById('feed-wrap');
  wrap.innerHTML = `
    <div class="card-scene" id="card-scene">
      <div class="combo-badge" id="combo-badge"></div>
      <div class="card-flipper" id="card-flipper">

        <div class="card-face card-front">
          <div class="card-category">${currentFact.category}</div>
          <div class="card-question">${currentFact.q}</div>
          <div class="tap-hint">
            <div class="tap-hint-icon">↵</div>
            <span>tap pentru răspuns</span>
          </div>
        </div>

        <div class="card-face card-back">
          <div class="answer-label">Răspuns</div>
          <div class="answer-text">${currentFact.a}</div>
          <div class="action-row">
            <button class="btn-action btn-dont" id="btn-dont">
              <span class="btn-icon">✕</span>
              <span>Nu știu</span>
            </button>
            <button class="btn-action btn-hard" id="btn-hard">
              <span class="btn-icon">~</span>
              <span>Greu</span>
            </button>
            <button class="btn-action btn-know" id="btn-know">
              <span class="btn-icon">✓</span>
              <span>Știu</span>
            </button>
          </div>
        </div>

      </div>
      <div class="flash-overlay" id="flash-overlay"></div>
    </div>
    <div class="swipe-hint">
      <span>← Nu știu</span>
      <span>Știu →</span>
    </div>
  `;

  if(combo >= 3) {
    let badge = document.getElementById('combo-badge');
    badge.textContent = `${combo}× COMBO`;
    badge.classList.add('show');
  }

  let scene = document.getElementById('card-scene');
  let flipper = document.getElementById('card-flipper');

  scene.addEventListener('click', () => {
    if(!isFlipped) { flip(); }
  });

  document.getElementById('btn-dont').addEventListener('click', e => { e.stopPropagation(); answer(1); });
  document.getElementById('btn-hard').addEventListener('click', e => { e.stopPropagation(); answer(3); });
  document.getElementById('btn-know').addEventListener('click', e => { e.stopPropagation(); answer(5); });

  let startX=0;
  scene.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; }, {passive:true});
  scene.addEventListener('touchend', e=>{
    if(!isFlipped) return;
    let diff = e.changedTouches[0].clientX - startX;
    if(diff > 70) answer(5);
    else if(diff < -70) answer(1);
  }, {passive:true});

  updateHUD();
}

function flip() {
  isFlipped = true;
  document.getElementById('card-flipper').classList.add('flipped');
  document.querySelector('.swipe-hint').classList.add('show'); // MAGIA AICI
  vibrate(20);
}

function answer(quality) {
  let id = getId(currentFact);
  let oldLevel = Math.floor(state.xp/100)+1;
  let xpGain = updateSRS(id, quality);

  let flashEl = document.getElementById('flash-overlay');
  if(quality === 5) {
    flashEl.className = 'flash-overlay flash-green';
    spawnParticles(document.getElementById('card-scene'), 'var(--accent)');
    vibrate([30,20,50]);
  } else if(quality === 1) {
    flashEl.className = 'flash-overlay flash-red';
    vibrate([80]);
  } else {
    vibrate(30);
  }

  showXpPopup(xpGain, combo);

  let scene = document.getElementById('card-scene');
  scene.classList.add(quality===5 ? 'exit-right' : 'exit-left');

  setTimeout(() => {
    updateHUD();
    checkLevelUp(oldLevel);
    renderCard();
  }, 280);
}

renderCard();
</script>
</body>
</html>
