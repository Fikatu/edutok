<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>PDA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-oled: #000000; 
      --card-bg: #111111;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #10b981; /* Verde PDA */
      --glow: rgba(16, 185, 129, 0.15);
      --text-main: #f8fafc;
      --text-muted: #8b9bb4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%;
      background-color: var(--bg-oled);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      overflow: hidden; 
      user-select: none; 
    }

    /* TOP BAR MINIMALIST */
    .top-bar {
      position: fixed; top: 0; left: 0; width: 100%;
      padding: 20px 25px; display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    }
    
    .close-btn {
      background: var(--card-bg); width: 40px; height: 40px;
      border-radius: 50%; display: grid; place-items: center;
      text-decoration: none; color: white; font-size: 1.1rem; border: 1px solid var(--card-border);
    }
    
    .filter-btn {
      background: var(--card-bg); padding: 8px 16px;
      border-radius: 20px; font-size: 0.85rem; font-weight: 600;
      color: white; border: 1px solid var(--card-border); cursor: pointer; transition: 0.3s;
    }
    .filter-btn.active {
      background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4); color: #ef4444;
    }

    .progress-text {
      color: var(--text-muted); font-size: 0.9rem; font-weight: 700; letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    /* CONTAINER SCROLL VERTICAL */
    .feed-container {
      height: 100vh; width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; 
    }
    .feed-container::-webkit-scrollbar { display: none; }

    .snap-card {
      height: 100vh; width: 100vw;
      scroll-snap-align: start; scroll-snap-stop: always; 
      display: flex; align-items: center; justify-content: center;
      padding: 0 20px; perspective: 1000px; /* Esențial pentru efectul 3D */
    }

    /* CARTONAȘUL CARE SE ROTEȘTE */
    .flip-inner {
      width: 100%; max-width: 400px; height: 65vh;
      position: relative;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d; cursor: pointer;
    }

    .snap-card.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    /* FEȚELE CARTONAȘULUI (Față / Spate) */
    .face {
      position: absolute; width: 100%; height: 100%;
      -webkit-backface-visibility: hidden; backface-visibility: hidden;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 40px 30px;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 50px var(--glow);
    }

    .face-front {
      justify-content: center; align-items: center; text-align: center;
    }

    .face-back {
      transform: rotateY(180deg);
      justify-content: flex-start;
    }

    /* ELEMENTE TEXT */
    .category-badge {
      color: var(--accent); font-size: 0.8rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: auto; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    
    .question {
      font-size: clamp(1.5rem, 6vw, 2rem); font-weight: 800; line-height: 1.3;
      margin: auto 0; color: white;
    }

    .tap-hint {
      margin-top: auto; color: var(--text-muted); font-size: 0.85rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px; animation: pulse 2s infinite;
    }

    .answer-container {
      flex-grow: 1; overflow-y: auto; overscroll-behavior: contain; margin: 20px 0;
      padding-right: 10px;
    }
    
    .answer-container::-webkit-scrollbar { width: 4px; }
    .answer-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .answer {
      font-size: clamp(1.1rem, 5vw, 1.3rem); color: rgba(255,255,255,0.9); 
      line-height: 1.6; font-weight: 400;
    }

    /* BUTON FAVORITE PE SPATE */
    .action-row {
      margin-top: auto; display: flex; justify-content: center; padding-top: 15px;
      border-top: 1px solid var(--card-border);
    }

    .like-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--card-border);
      padding: 12px 25px; border-radius: 20px; color: white; font-size: 1rem; font-weight: 600;
      display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s;
    }
    .like-btn:active { transform: scale(0.95); }
    .like-btn.liked { 
      background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.3);
    }

    .empty-state { text-align: center; color: var(--text-muted); padding: 40px; margin: auto;}
    .empty-state h2 { color: white; margin-bottom: 10px; font-size: 1.5rem;}

    @keyframes pulse {
      0%, 100% { opacity: 0.5; } 50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="menu_pda.html" class="close-btn">←</a>
    <button class="filter-btn" id="filter-btn" onclick="toggleFilter()">Arată doar ❤️</button>
    <div class="progress-text" id="counter">0 / 0</div>
  </div>

  <div class="feed-container" id="feed">
    </div>

  <script>
    const facts = [
      { category: "PDA", q: "Ce reprezintă procedura administrativă necontencioasă?", a: "Procedura urmată de autoritățile publice la emiterea actelor sau eliberarea de avize, în absența unui litigiu (la birou/ghișeu)." },
      { category: "PDA", q: "Ce presupune deconcentrarea administrativă?", a: "Reprezentanții locali ai puterii centrale (ex: Prefectura) iau decizii în teritoriu, dar sunt subordonați ierarhic centrului." },
      { category: "PDA", q: "Ce fel de control exercită Prefectul asupra actelor emise de Consiliul Local?", a: "Un control exclusiv de legalitate (tutelă administrativă), neputând cenzura oportunitatea actului (dacă e „bun” sau „rău”)." },
      { category: "PDA", q: "La ce instanță se atacă actele emise de autoritățile publice centrale (ex: Guvern)?", a: "La Curtea de Apel (secția de contencios administrativ și fiscal)." },
      { category: "PDA", q: "Cum se calculează un termen procedural pe zile (regula CPC)?", a: "Pe zile libere: nu intră în calcul nici ziua în care începe, nici ziua în care se sfârșește." },
      { category: "PDA", q: "Ce valoare juridică are un 'aviz conform'?", a: "Autoritatea emitentă este obligată prin lege atât să îl solicite, cât și să îl respecte întocmai (un aviz negativ blochează actul)." },
      { category: "PDA", q: "Cum operează procedura aprobării tacite?", a: "Dacă administrația nu răspunde în termenul legal la o cerere completă, autorizația se consideră acordată din oficiu." }
    ];

    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getSavedQuestions() {
      const saved = localStorage.getItem('eduScroll_Favorites');
      return saved ? JSON.parse(saved) : [];
    }

    function saveQuestionsToMemory(arr) {
      localStorage.setItem('eduScroll_Favorites', JSON.stringify(arr));
    }

    let isFilterMode = false;
    let savedQuestionsList = getSavedQuestions();
    const feedContainer = document.getElementById('feed');
    let observer;
    let shuffledFacts = shuffleArray(facts);

    function renderCards() {
      feedContainer.innerHTML = '';
      let cardsToShow = shuffledFacts; 
      
      if (isFilterMode) {
        cardsToShow = shuffledFacts.filter(fact => savedQuestionsList.includes(fact.q));
      }

      if (cardsToShow.length === 0) {
        feedContainer.innerHTML = `
          <div class="snap-card">
            <div class="empty-state">
              <h2>Niciun cartonaș salvat</h2>
              <p>Oprește filtrul, întoarce cartonașele și apasă "Reține" pentru a salva noțiunile grele.</p>
            </div>
          </div>
        `;
        document.getElementById('counter').innerText = `0 / 0`;
        return;
      }

      cardsToShow.forEach((fact, index) => {
        const cardContainer = document.createElement('div');
        cardContainer.className = 'snap-card';
        
        const isLiked = savedQuestionsList.includes(fact.q);
        const heartClass = isLiked ? 'liked' : '';
        const heartText = isLiked ? '❤️ Reținut' : '🤍 Reține';

        cardContainer.innerHTML = `
          <div class="flip-inner">
            <div class="face face-front">
              <div class="category-badge">${fact.category}</div>
              <div class="question">${fact.q}</div>
              <div class="tap-hint">Atinge pentru răspuns 🔄</div>
            </div>
            
            <div class="face face-back">
              <div class="category-badge" style="margin-bottom: 15px;">Răspuns</div>
              <div class="answer-container">
                <div class="answer">${fact.a}</div>
              </div>
              <div class="action-row">
                <button class="like-btn ${heartClass}">${heartText}</button>
              </div>
            </div>
          </div>
        `;
        
        feedContainer.appendChild(cardContainer);

        const flipInner = cardContainer.querySelector('.flip-inner');
        const likeBtn = cardContainer.querySelector('.like-btn');

        // Logică de Flip (Rotire 3D)
        flipInner.addEventListener('click', function() {
          cardContainer.classList.toggle('flipped');
          if (navigator.vibrate) navigator.vibrate(15);
        });

        // Logică de Salvare Favorite (Fără a roti cardul înapoi)
        likeBtn.addEventListener('click', function(e) {
          e.stopPropagation(); // Oprește "click-ul" să ajungă la panoul de flip
          toggleFavorite(fact.q, likeBtn);
        });
      });

      setupObserver(cardsToShow.length);
    }

    function toggleFavorite(questionText, btnElement) {
      if (savedQuestionsList.includes(questionText)) {
        savedQuestionsList = savedQuestionsList.filter(q => q !== questionText);
        btnElement.classList.remove('liked');
        btnElement.innerHTML = '🤍 Reține';
      } else {
        savedQuestionsList.push(questionText);
        btnElement.classList.add('liked');
        btnElement.innerHTML = '❤️ Reținut';
        if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
      }
      saveQuestionsToMemory(savedQuestionsList);

      if (isFilterMode && !savedQuestionsList.includes(questionText)) {
        renderCards();
      }
    }

    window.toggleFilter = function() {
      const filterBtn = document.getElementById('filter-btn');
      isFilterMode = !isFilterMode; 
      
      if (isFilterMode) {
        filterBtn.classList.add('active');
        filterBtn.innerText = "Vezi Toate";
      } else {
        filterBtn.classList.remove('active');
        filterBtn.innerText = "Arată doar ❤️";
      }
      renderCards(); 
    };

    function setupObserver(totalCards) {
      if(observer) observer.disconnect(); 
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const allCards = Array.from(document.querySelectorAll('.snap-card'));
            const index = allCards.indexOf(entry.target) + 1;
            document.getElementById('counter').innerText = `${index} / ${totalCards}`;
          }
        });
      }, { threshold: 0.5 }); 
      document.querySelectorAll('.snap-card').forEach(card => observer.observe(card));
    }

    renderCards();
  </script>
</body>
</html>
